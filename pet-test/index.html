<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测测你和你的宠物前世是什么关系</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%239CAF9B'%3E%3Cellipse cx='50' cy='62' rx='18' ry='22'/%3E%3Ccircle cx='26' cy='44' r='8'/%3E%3Ccircle cx='42' cy='36' r='8'/%3E%3Ccircle cx='58' cy='36' r='8'/%3E%3Ccircle cx='74' cy='44' r='8'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F6F1EA;
    --bg-soft:#EFE9E0;
    --card:#FFFFFF;
    --ink:#453F38;
    --ink-soft:#6E655B;
    --sub:#9A9085;
    --line:#EAE2D7;
    --green:#9CAF9B;
    --green-deep:#7E947D;
    --pink:#E6CFC8;
    --blue:#C4D2D6;
    --tan:#D9C7AE;
    --radius:22px;
    --shadow:0 10px 30px rgba(120,105,88,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg,#F8F3EC 0%,#F4EEE6 48%,#F6F1EA 100%);
    position:relative;
    overflow:hidden;
  }
  /* 顶部标题栏 */
  .topbar{
    padding:16px 20px 10px;
    text-align:center;
    position:relative;
    z-index:2;
  }
  .topbar h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:.5px;
    color:var(--ink-soft);
  }
  .topbar .sub{
    font-size:11.5px;
    color:var(--sub);
    margin-top:2px;
    letter-spacing:1px;
  }
  /* 视图容器 */
  .view{
    flex:1;
    display:none;
    flex-direction:column;
    padding:0 20px 32px;
    animation:fadeIn .28s ease;
  }
  .view.active{display:flex;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ===== 封面 ===== */
  #cover{justify-content:flex-start;}
  .cover-art{
    margin:18px auto 0;
    width:180px;
    height:180px;
    position:relative;
  }
  .cover-title{
    text-align:center;
    margin-top:22px;
  }
  .cover-title .kicker{
    display:inline-block;
    font-size:12px;
    color:var(--green-deep);
    background:rgba(156,175,155,.14);
    padding:5px 14px;
    border-radius:999px;
    letter-spacing:2px;
    margin-bottom:16px;
  }
  .cover-title h2{
    font-size:27px;
    font-weight:700;
    line-height:1.45;
    letter-spacing:1px;
  }
  .cover-title h2 em{
    font-style:normal;
    color:var(--green-deep);
  }
  .cover-lead{
    margin:20px auto 0;
    max-width:330px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .cover-meta{
    margin:22px auto 0;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .cover-meta span{
    font-size:12.5px;
    color:var(--sub);
    background:var(--card);
    border:1px solid var(--line);
    padding:7px 14px;
    border-radius:999px;
  }
  .cover-cta{
    margin-top:auto;
    padding-top:34px;
  }
  .btn-primary{
    width:100%;
    border:none;
    background:var(--green);
    color:#fff;
    font-size:16.5px;
    font-weight:600;
    letter-spacing:2px;
    padding:16px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 12px 24px rgba(126,148,125,.32);
    transition:transform .15s ease,background .15s ease;
  }
  .btn-primary:active{transform:scale(.97);background:var(--green-deep);}
  .cover-note{
    text-align:center;
    font-size:12px;
    color:var(--sub);
    margin-top:14px;
  }

  /* ===== 答题页 ===== */
  .quiz-head{
    margin-top:14px;
  }
  .quiz-progress-text{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--sub);
    margin-bottom:8px;
  }
  .progress-track{
    height:6px;
    background:var(--bg-soft);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,var(--green),#B7C6B4);
    border-radius:999px;
    transition:width .3s ease;
  }
  .question-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 22px 22px;
    margin-top:20px;
  }
  .question-tag{
    font-size:12px;
    color:var(--green-deep);
    letter-spacing:2px;
    margin-bottom:12px;
  }
  .question-text{
    font-size:19px;
    font-weight:600;
    line-height:1.6;
    margin-bottom:24px;
  }
  .options{display:flex;flex-direction:column;gap:13px;}
  .option{
    display:flex;
    align-items:center;
    gap:13px;
    border:1.5px solid var(--line);
    background:#FDFCFB;
    border-radius:18px;
    padding:15px 16px;
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
    text-align:left;
    transition:all .15s ease;
    min-height:44px;
  }
  .option .dot{
    flex:none;
    width:20px;height:20px;
    border:1.5px solid #CFC6B9;
    border-radius:50%;
    position:relative;
  }
  .option.selected{
    border-color:var(--green);
    background:rgba(156,175,155,.10);
  }
  .option.selected .dot{border-color:var(--green);}
  .option.selected .dot::after{
    content:"";
    position:absolute;inset:4px;
    background:var(--green);
    border-radius:50%;
  }
  .quiz-foot{
    margin-top:24px;
  }
  .btn-next{
    width:100%;
    border:none;
    background:var(--green);
    color:#fff;
    font-size:16px;
    font-weight:600;
    letter-spacing:2px;
    padding:15px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn-next:disabled{
    background:#D8D0C5;
    color:#fff;
    cursor:not-allowed;
    box-shadow:none;
  }
  .btn-next:not(:disabled):active{transform:scale(.97);}
  .quiz-back{
    margin-top:14px;
    text-align:center;
    font-size:13px;
    color:var(--sub);
    background:none;border:none;
    cursor:pointer;
  }

  /* ===== 结果页 ===== */
  #result{padding-top:10px;}
  .result-badge{
    text-align:center;
    font-size:12px;
    color:var(--sub);
    letter-spacing:2px;
    margin-top:12px;
  }
  .result-hero{
    margin:16px auto 0;
    border-radius:28px;
    padding:34px 24px 28px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .result-hero .emoji-wrap{
    width:86px;height:86px;
    margin:0 auto 16px;
    background:rgba(255,255,255,.55);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .result-hero h2{
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
  }
  .result-hero .tagline{
    margin-top:10px;
    font-size:14.5px;
    color:var(--ink-soft);
  }
  .result-section{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 22px;
    margin-top:16px;
  }
  .result-section h3{
    font-size:15px;
    font-weight:600;
    margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .result-section h3::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--green);
    flex:none;
  }
  .result-section p{
    font-size:14.5px;
    color:var(--ink-soft);
  }
  .result-traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .result-traits span{
    font-size:12.5px;
    padding:6px 13px;
    border-radius:999px;
    background:var(--bg-soft);
    color:var(--ink-soft);
  }
  .result-actions{margin-top:26px;display:flex;flex-direction:column;gap:12px;}
  .btn-ghost{
    width:100%;
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    font-size:15px;
    padding:14px;
    border-radius:999px;
    cursor:pointer;
  }
  .btn-ghost:active{background:var(--bg-soft);}
  .result-share{
    margin-top:18px;
    text-align:center;
    font-size:12px;
    color:var(--sub);
  }
  .toast{
    position:fixed;
    left:50%;bottom:80px;
    transform:translateX(-50%);
    background:rgba(69,63,56,.92);
    color:#fff;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:50;
  }
  .toast.show{opacity:1;}

  @media(min-width:768px){
    .app{box-shadow:0 0 60px rgba(120,105,88,.12);}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>测测你和你的宠物前世是什么关系</h1>
    <div class="sub">15 道小题 · 看看你们的缘分从何而来</div>
  </header>

  <!-- ===== 封面 ===== -->
  <section id="cover" class="view active">
    <div class="cover-art" aria-hidden="true">
      <svg viewBox="0 0 180 180" width="180" height="180">
        <circle cx="90" cy="90" r="72" fill="#EFE9E0"/>
        <circle cx="90" cy="90" r="54" fill="#E6CFC8" opacity=".55"/>
        <!-- 猫轮廓 -->
        <g fill="#7E947D">
          <path d="M63 74 L70 58 L80 70 Z"/>
          <path d="M100 70 L110 58 L117 74 Z"/>
          <ellipse cx="90" cy="92" rx="28" ry="25"/>
        </g>
        <circle cx="80" cy="90" r="2.6" fill="#453F38"/>
        <circle cx="100" cy="90" r="2.6" fill="#453F38"/>
        <path d="M87 97 Q90 100 93 97" stroke="#453F38" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- 爪印 -->
        <g fill="#D9C7AE" opacity=".85">
          <ellipse cx="48" cy="128" rx="7" ry="9"/>
          <circle cx="38" cy="119" r="3.4"/><circle cx="46" cy="115" r="3.4"/><circle cx="54" cy="115" r="3.4"/><circle cx="62" cy="119" r="3.4"/>
        </g>
        <g fill="#C4D2D6" opacity=".85">
          <ellipse cx="132" cy="52" rx="6" ry="8"/>
          <circle cx="123" cy="45" r="3"/><circle cx="130" cy="41" r="3"/><circle cx="137" cy="41" r="3"/><circle cx="144" cy="45" r="3"/>
        </g>
      </svg>
    </div>
    <div class="cover-title">
      <span class="kicker">缘分小测试</span>
      <h2>你和毛孩子的<br><em>前世羁绊</em>，到底是什么？</h2>
    </div>
    <p class="cover-lead">
      从你们日常相处的小细节里，读出一段跨越轮回的缘分。不用想太多，凭第一感觉选就好，答案会替你说出平时没注意到的默契。
    </p>
    <div class="cover-meta">
      <span>共 15 题</span>
      <span>约 2 分钟</span>
      <span>无需登录</span>
    </div>
    <div class="cover-cta">
      <button class="btn-primary" id="startBtn">开始测试</button>
      <p class="cover-note">测试仅供娱乐，缘分这件事，开心最重要</p>
    </div>
  </section>

  <!-- ===== 答题 ===== -->
  <section id="quiz" class="view">
    <div class="quiz-head">
      <div class="quiz-progress-text">
        <span id="qIndexText">第 1 / 15 题</span>
        <span id="qPercent">7%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="question-card">
      <div class="question-tag" id="questionTag">相处日常</div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsBox"></div>
    </div>
    <div class="quiz-foot">
      <button class="btn-next" id="nextBtn" disabled>下一题</button>
      <button class="quiz-back" id="backBtn">返回上一题</button>
    </div>
  </section>

  <!-- ===== 结果 ===== -->
  <section id="result" class="view">
    <div class="result-badge">你们的前世关系是</div>
    <div class="result-hero" id="resultHero">
      <div class="emoji-wrap" id="resultIcon"></div>
      <h2 id="resultName"></h2>
      <div class="tagline" id="resultTagline"></div>
    </div>
    <div class="result-section">
      <h3>前世缘起</h3>
      <p id="resultStory"></p>
    </div>
    <div class="result-section">
      <h3>今生你们这样相处</h3>
      <p id="resultLife"></p>
      <div class="result-traits" id="resultTraits"></div>
    </div>
    <div class="result-section">
      <h3>给你们的小提醒</h3>
      <p id="resultTip"></p>
    </div>
    <div class="result-actions">
      <button class="btn-primary" id="restartBtn">重新测试</button>
      <button class="btn-ghost" id="copyBtn">复制我的结果文案</button>
    </div>
    <p class="result-share">测完可以截图发给同样养宠的朋友，看看你们的缘分一不一样</p>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 题目数据：每题 4 个选项，选项对应结果类型 ===== */
const QUESTIONS = [
  {
    tag:"相处日常",
    text:"你刚到家，它最可能以哪种方式迎接你？",
    options:[
      {label:"立刻黏上来，贴着你不肯走，像分开了好久没见", type:"family"},
      {label:"跟在你身后转一圈，各忙各的，但知道你回来了", type:"companion"},
      {label:"先站定观察你几秒，确认你状态没事才放松下来", type:"guardian"},
      {label:"立刻跑到门口守着你，寸步不离", type:"loyal"}
    ]
  },
  {
    tag:"周末时光",
    text:"周末你们俩最常有的状态是？",
    options:[
      {label:"一起追闹玩耍，玩到彼此都累瘫", type:"playmate"},
      {label:"安静依偎在你身边，眼神一直黏着你", type:"lover"},
      {label:"你心情不好时它主动凑过来，气氛慢慢变软", type:"healer"},
      {label:"各做各的事，但待在同一个空间里就很安心", type:"soulmate"}
    ]
  },
  {
    tag:"小摩擦",
    text:"你和它发生小摩擦时，通常是什么画风？",
    options:[
      {label:"互相赌气一小会儿，转头又凑到一起", type:"rival"},
      {label:"它会一直等你消气，怎么哄都不离开", type:"believer"},
      {label:"你学着读懂它的信号，它也在慢慢适应你的节奏", type:"mentor"},
      {label:"吵完各自散开溜达一圈，回来就翻篇了", type:"traveler"}
    ]
  },
  {
    tag:"深夜时刻",
    text:"深夜你睡不着，它一般会怎么做？",
    options:[
      {label:"钻进被窝挨着你，像家里人一样陪你熬着", type:"family"},
      {label:"扒拉你，想拉你起来继续玩", type:"playmate"},
      {label:"趴在床边守着，确认你睡熟才趴下", type:"guardian"},
      {label:"把脑袋搁在你手边，安安静静陪你平复情绪", type:"healer"}
    ]
  },
  {
    tag:"出行想象",
    text:"想象一段长途出行，你更希望它怎样？",
    options:[
      {label:"跟你一起上路，路上互相照应", type:"companion"},
      {label:"在家也一直惦记你，等你回来", type:"lover"},
      {label:"留在原地等你，忠诚地守着这个家", type:"loyal"},
      {label:"各自自在，知道彼此心里都有对方", type:"soulmate"}
    ]
  },
  {
    tag:"关系定位",
    text:"你觉得你们之间更像什么？",
    options:[
      {label:"嘴上嫌弃，身体很诚实", type:"rival"},
      {label:"你教它规矩，它教你耐心和温柔", type:"mentor"},
      {label:"这份缘分好像等了很久才轮到", type:"believer"},
      {label:"遇到了就结伴走一段，缘分自然", type:"traveler"}
    ]
  },
  {
    tag:"心软瞬间",
    text:"它让你最心软的瞬间是？",
    options:[
      {label:"那种毫无保留的亲近，像血缘一样天然", type:"family"},
      {label:"望向你时，眼里只有你的专注", type:"lover"},
      {label:"默默挡在你身前保护你的样子", type:"guardian"},
      {label:"你一个眼神，它就懂你的默契", type:"soulmate"}
    ]
  },
  {
    tag:"日常相处",
    text:"日常相处里，你更享受哪一种？",

      {label:"并肩过日子，平淡踏实", type:"companion"},
      {label:"打打闹闹，家里永远有笑声", type:"playmate"},
      {label:"互相治愈，彼此都是对方的情绪出口", type:"healer"},
      {label:"它百分百信任你、依赖你的踏实感", type:"loyal"}
    ]
  },
  {
    tag:"忙碌时刻",
    text:"当你忙到顾不上它，它会怎么做？",
    options:[
      {label:"故意捣乱刷存在感，跟你闹别扭", type:"rival"},

      {label:"自己学着安排作息，慢慢变得懂事", type:"mentor"},
      {label:"黏过来打断你，生怕被忽略", type:"family"}

  },
  {
    tag:"新环境",

  {
    tag:"碎碎念",
    text:"你跟它自言自语式地聊天，氛围更接近？",

  {

  {

  {
    tag:"身份互换",
    text:"如果你们互换身份待一天，你觉得会怎样？",

      {label:"完全理解彼此的小脾气和习惯", type:"soulmate"},
      {label:"会互相请教对方的生活方式", type:"mentor"},
      {label:"发现自己比想象中更在乎对方", type:"lover"}
    ]
  },
  {
    tag:"缘分回望",
    text:"现在回头看这段缘分，你觉得？",
    options:[
      {label:"它出现之后，我整个人都变柔软了", type:"healer"},

const TYPE_ORDER = ["family","companion","guardian","loyal","playmate","lover","healer","soulmate","rival","believer","mentor","traveler"];

/* ===== 状态与逻辑 ===== */
const state = { index:0, answers:new Array(QUESTIONS.length).fill(null) };

const $ = (id)=>document.getElementById(id);
const views = ["cover","quiz","result"];

function showView(name){
  views.forEach(v=>$(v).classList.toggle("active", v===name));
  window.scrollTo({top:0});
}

function renderQuestion(){
  const q = QUESTIONS[state.index];
  const total = QUESTIONS.length;
  $("qIndexText").textContent = `第 ${state.index+1} / ${total} 题`;
  $("qPercent").textContent = `${Math.round(((state.index+1)/total)*100)}%`;
  $("progressFill").style.width = `${(state.index+1)/total*100}%`;
  $("questionTag").textContent = q.tag;
  $("questionText").textContent = q.text;
  const box = $("optionsBox");
  box.innerHTML = "";
  q.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.className = "option" + (state.answers[state.index]===i ? " selected":"");
    btn.innerHTML = `<span class="dot"></span><span>${opt.label}</span>`;
    btn.addEventListener("click",()=>{
      state.answers[state.index] = i;
      box.querySelectorAll(".option").forEach((el,ei)=>el.classList.toggle("selected", ei===i));
      $("nextBtn").disabled = false;
    });
    box.appendChild(btn);
  });
  $("nextBtn").disabled = state.answers[state.index]===null;
  $("nextBtn").textContent = state.index===total-1 ? "查看我的结果" : "下一题";
  $("backBtn").style.visibility = state.index===0 ? "hidden":"visible";
}

$("startBtn").addEventListener("click",()=>{ state.index=0; renderQuestion(); showView("quiz"); });
$("nextBtn").addEventListener("click",()=>{
  if(state.answers[state.index]===null) return;
  if(state.index < QUESTIONS.length-1){ state.index++; renderQuestion(); }
  else{ showResult(); }
});
$("backBtn").addEventListener("click",()=>{
  if(state.index>0){ state.index--; renderQuestion(); }
});

function computeType(){
  const score = {};
  TYPE_ORDER.forEach(t=>score[t]=0);
  state.answers.forEach((ansIdx,qi)=>{
    if(ansIdx===null) return;
    const t = QUESTIONS[qi].options[ansIdx].type;
    score[t]++;
  });
  let best = TYPE_ORDER[0], bestScore = -1;
  TYPE_ORDER.forEach(t=>{ if(score[t]>bestScore){ bestScore=score[t]; best=t; } });
  return best;
}

  const icons = {
    family:'<path d="M40 50 a10 10 0 0 1 20 0 c0 12 -10 19 -10 19 s-10 -7 -10 -19z"/>',
    companion:'<path d="M30 55 h40 M40 40 l10 15 10-15"/>',

    loyal:'<circle cx="50" cy="50" r="16"/><circle cx="38" cy="40" r="5"/><circle cx="50" cy="36" r="5"/><circle cx="62" cy="40" r="5"/>',
    playmate:'<circle cx="35" cy="42" r="6"/><circle cx="50" cy="36" r="6"/><circle cx="65" cy="42" r="6"/><ellipse cx="50" cy="58" rx="14" ry="10"/>',
    lover:'<path d="M50 66 C36 56 26 46 26 36 a12 12 0 0 1 24 -4 a12 12 0 0 1 24 4 c0 10 -10 20 -24 30z"/>',

  return `<svg viewBox="0 0 100 100" width="52" height="52" fill="#7E947D" stroke="#7E947D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${icons[type]||icons.family}</svg>`;
}

function showResult(){
  const type = computeType();
  const r = RESULTS[type];
  $("resultHero").style.background = r.color;
  $("resultIcon").innerHTML = resultIconSvg(type);
  $("resultName").textContent = r.name;
  $("resultTagline").textContent = r.tagline;
  $("resultStory").textContent = r.story;
  $("resultLife").textContent = r.life;
  $("resultTip").textContent = r.tip;
  $("resultTraits").innerHTML = r.traits.map(t=>`<span>${t}</span>`).join("");
  state.currentType = type;
  showView("result");
}

$("restartBtn").addEventListener("click",()=>{
  state.index = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.currentType = null;
  showView("cover");
});

$("copyBtn").addEventListener("click",()=>{
  const r = RESULTS[state.currentType];
  const text = `【测测你和你的宠物前世是什么关系】\n我的结果：${r.name}\n${r.tagline}\n\n${r.story}\n\n#养宠日常 #毛孩子 #缘分测试`;
  const done = ()=>showToast("结果文案已复制，去发小红书吧");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else{ fallbackCopy(text,done); }
});

function fallbackCopy(text,done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ showToast("复制失败，请手动截图保存"); }
  document.body.removeChild(ta);
}

function showToast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"),1800);
}
</script>
</body>
</html>
